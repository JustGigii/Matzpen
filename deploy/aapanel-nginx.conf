# Paste inside the aaPanel HTTPS site's `server {}` block after replacing the domain.
# aaPanel owns the listen/certificate directives. OpenWA port 2785 is intentionally absent.

client_max_body_size 2m;

location = /api/webhooks/openwa {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location = /health/live {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health/ready {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Keep status private. Add aaPanel IP allow-list or Basic Auth before enabling this location.
location = /api/status {
    deny all;
}

# Do not publish FastAPI docs or any unrelated route from this webhook-only vhost.
location / {
    return 404;
}

