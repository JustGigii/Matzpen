services:
  personal-agent:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: sqlite+aiosqlite:////app/data/personal_agent.db
      TIMEZONE: ${TIMEZONE:-Asia/Jerusalem}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      SHORTCUT_BEARER_TOKEN: ${SHORTCUT_BEARER_TOKEN:-}
      GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE:-}
      GOOGLE_TOKEN_FILE: ${GOOGLE_TOKEN_FILE:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-development-only-openwa-secret}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-http://host.docker.internal:2785/api}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-}
      OPENWA_SIGNATURE_HEADER: ${OPENWA_SIGNATURE_HEADER:-X-OpenWA-Signature}
      OPENWA_WEBHOOK_MAX_BYTES: ${OPENWA_WEBHOOK_MAX_BYTES:-1048576}
      WHATSAPP_IGNORE_ARCHIVED: ${WHATSAPP_IGNORE_ARCHIVED:-true}
      WHATSAPP_IGNORED_CHAT_IDS: ${WHATSAPP_IGNORED_CHAT_IDS:-}
      WHATSAPP_ARCHIVE_REFRESH_MINUTES: ${WHATSAPP_ARCHIVE_REFRESH_MINUTES:-30}
      WHATSAPP_INITIAL_HISTORY_DAYS: ${WHATSAPP_INITIAL_HISTORY_DAYS:-7}
      WHATSAPP_HISTORY_MODE: review_only
      WHATSAPP_HISTORY_MAX_MESSAGES: ${WHATSAPP_HISTORY_MAX_MESSAGES:-3000}
      WHATSAPP_HISTORY_MAX_MESSAGES_PER_CHAT: ${WHATSAPP_HISTORY_MAX_MESSAGES_PER_CHAT:-300}
      WHATSAPP_CONVERSATION_IDLE_SECONDS: ${WHATSAPP_CONVERSATION_IDLE_SECONDS:-300}
      WHATSAPP_URGENT_BYPASS_MINUTES: ${WHATSAPP_URGENT_BYPASS_MINUTES:-15}
      WHATSAPP_MAX_MEDIA_BYTES: ${WHATSAPP_MAX_MEDIA_BYTES:-18874368}
      WHATSAPP_EVENT_RETENTION_DAYS: ${WHATSAPP_EVENT_RETENTION_DAYS:-30}
      WHATSAPP_DISCONNECT_WARNING_MINUTES: ${WHATSAPP_DISCONNECT_WARNING_MINUTES:-10}
      INTERNAL_ACTION_GRACE_SECONDS: ${INTERNAL_ACTION_GRACE_SECONDS:-60}
      DEFAULT_REMINDER_LEAD_MINUTES: ${DEFAULT_REMINDER_LEAD_MINUTES:-5}
      PROACTIVE_CHECK_INTERVAL_SECONDS: ${PROACTIVE_CHECK_INTERVAL_SECONDS:-60}
      CLARIFICATION_FALLBACK_MINUTES: ${CLARIFICATION_FALLBACK_MINUTES:-10}
      APPROVAL_EXPIRY_HOURS: ${APPROVAL_EXPIRY_HOURS:-24}
      OVERDUE_GRACE_MINUTES: ${OVERDUE_GRACE_MINUTES:-15}
      MORNING_BRIEF_FALLBACK_TIME: ${MORNING_BRIEF_FALLBACK_TIME:-10:00}
      QUIET_HOURS_START: ${QUIET_HOURS_START:-}
      QUIET_HOURS_END: ${QUIET_HOURS_END:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - personal-agent-data:/app/data
      - ./secrets:/app/secrets
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  personal-agent-data:
