[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Approval-gated personal agent control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.170,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "google-genai>=1.30,<2",
  "httpx>=0.27,<1",
  "oracledb>=3.0,<4",
  "pydantic-settings>=2.6,<3",
  "python-telegram-bot>=22.0,<23",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
"src/personal_agent/integrations/telegram/runtime.py" = ["RUF001"]
"src/personal_agent/services/whatsapp.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
